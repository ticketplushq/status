status-website:
  publish: true
  cname: status.ticketplus.global
  theme: light
  logoUrl: https://cdn-r2.ticketplus.global/landings/servicios-web/brand-preview/files/logo/tp-isotipo-fondo-blanco.png
  favicon: https://cdn-r2.ticketplus.global/landings/servicios-web/brand-preview/files/logo/tp-isotipo-fondo-blanco.png
  faviconSvg: https://cdn-r2.ticketplus.global/landings/servicios-web/brand-preview/files/logo/tp-isotipo-fondo-blanco.svg
  name: Ticketplus System Status
  introTitle: "**Ticketplus** is up and running"
  introMessage: "Having trouble? Contact us via SAC, or if you are a producer your Contact Group."
  navbar:
    - title: Status
      href: /
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap
    - rel: stylesheet
      href: /ticketplus-status.css
  js: |
    (function () {
      function paint(sites) {
        var down = 0, degraded = 0, i;
        for (i = 0; i < sites.length; i++) {
          if (sites[i].status === "down") down++;
          else if (sites[i].status === "degraded") degraded++;
        }
        var cls = "tp-hero--ok";
        var title = "<strong>Ticketplus</strong> is up and running";
        if (down) {
          cls = "tp-hero--down";
          title = "<strong>Ticketplus</strong> has an outage";
        } else if (degraded) {
          cls = "tp-hero--degraded";
          title = "<strong>Ticketplus</strong> has degraded performance";
        }
        var hdr = document.querySelector("main header");
        if (!hdr) return;
        var el = document.createElement("div");
        el.className = "tp-hero " + cls;
        el.innerHTML =
          '<div><h1 class="tp-hero__title">' +
          title +
          '</h1><p class="tp-hero__lead">Having trouble? Contact us via SAC, or if you are a producer your Contact Group.</p></div>';
        hdr.replaceWith(el);
        if (document.querySelector(".tp-legend")) return;
        var legend = document.createElement("ul");
        legend.className = "tp-legend";
        legend.setAttribute("aria-label", "Status legend");
        legend.innerHTML =
          '<li><i class="ok"></i> No issues</li>' +
          '<li><i class="maint"></i> Maintenance</li>' +
          '<li><i class="degraded"></i> Degraded</li>' +
          '<li><i class="down"></i> Outage</li>';
        var live = document.querySelector(".f.changed");
        if (live && live.parentNode) live.parentNode.insertBefore(legend, live);
      }
      function run() {
        fetch(
          "https://raw.githubusercontent.com/ticketplushq/status/master/history/summary.json"
        )
          .then(function (r) {
            return r.json();
          })
          .then(paint)
          .catch(function () {});
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }
    })();

i18n:
  liveStatus: Current status by service
  allSystemsOperational: All systems are operational
  footer: Status powered by [Upptime](https://upptime.js.org)
  up: Up
  down: Down
  degraded: Degraded
